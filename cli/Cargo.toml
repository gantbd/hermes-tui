[package]
name = "hermes-tui-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "hermes-tui"
path = "src/main.rs"
doc = false

[dependencies]
hermes-tui = { path = ".." }
hermes-consumer-command = { version = "=0.1.0", path = "../../hermes/crates/hermes-consumer-command" }
hermes-disclosure-command = { version = "=0.1.0", path = "../../hermes/crates/hermes-disclosure-command" }
hermes-operator-command = { version = "=0.1.0", path = "../../hermes/crates/hermes-operator-command" }
hermes-tui-local-client = { path = "../local-client" }
hermes-client = { version = "=0.1.0", path = "../../hermes/crates/hermes-client" }
hermes-protocol = { version = "=0.1.0", path = "../../hermes/crates/hermes-protocol" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
serde_json = "=1.0.151"

[dev-dependencies]
hermes-ledger = { version = "=0.0.1", path = "../../hermes" }
hermes-service = { version = "=0.1.0", path = "../../hermes/crates/hermes-service" }
hermes-local-daemon = { version = "=0.1.0", path = "../../hermes/crates/hermes-local-daemon" }
hermes-local = { version = "=0.0.1", path = "../../hermes/adapters/hermes-local" }
hermes-wire = { version = "=0.1.0", path = "../../hermes/crates/hermes-wire" }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
