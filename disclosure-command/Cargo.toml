[package]
name = "hermes-disclosure-command"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
description = "Exact-confirmation guard for bounded Hermes event disclosure"

[dependencies]
hermes-client = { version = "=0.1.0", path = "../../hermes/crates/hermes-client" }
hermes-protocol = { version = "=0.1.0", path = "../../hermes/crates/hermes-protocol" }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
