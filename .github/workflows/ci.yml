name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out Hermes TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hermes-tui
          persist-credentials: false
      - name: Check out Keystone dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/keystone
          ref: 2e4faf10ec0a70805aa1db1555f93c77fcf0a1e4
          path: keystone
          persist-credentials: false
      - name: Check out Aegis dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/aegis
          ref: b272106cf6d0093839a7d696c829bf8a408b0306
          path: aegis
          persist-credentials: false
      - name: Check out Hermes dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/hermes
          ref: 3f60c1c7b00b1a61230508b11422ddfc84b61856
          path: hermes
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Install gate prerequisites
        run: brew install ripgrep
      - name: Fetch locked dependencies
        working-directory: hermes-tui
        run: cargo fetch --locked
      - name: Audit current RustSec advisories
        working-directory: hermes-tui
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings
      - name: Verify workspace and live profile
        working-directory: hermes-tui
        run: make check
